name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v

      - name: Windows installer smoke test
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $clientId = "11111111-1111-4111-8111-111111111111"
          $tenantId = "22222222-2222-4222-8222-222222222222"

          function Invoke-Installer([string]$VaultRoot) {
            powershell -NoProfile -ExecutionPolicy Bypass -File .\install.ps1 `
              -VaultRoot $VaultRoot `
              -ClientId $clientId `
              -TenantId $tenantId `
              -ReadOnly
            if ($LASTEXITCODE -ne 0) {
              throw "install.ps1 failed for '$VaultRoot' with exit code $LASTEXITCODE"
            }
          }

          function Assert-SkillInstalled([string]$VaultRoot) {
            $skill = [System.IO.Path]::Combine($VaultRoot, ".claude", "skills", "ingest-outlook")
            $fetch = [System.IO.Path]::Combine($skill, "fetch.py")
            $nestedDocs = [System.IO.Path]::Combine($skill, "docs", "docs")
            if (Test-Path -LiteralPath $nestedDocs) {
              throw "re-running install.ps1 nested docs\docs at $nestedDocs"
            }
            if (-not (Test-Path -LiteralPath $fetch)) {
              throw "fetch.py missing at $fetch"
            }
          }

          $vault = [System.IO.Path]::Combine($env:RUNNER_TEMP, "ingest-outlook-vault")
          Invoke-Installer $vault
          Invoke-Installer $vault
          Assert-SkillInstalled $vault
          $fetch = [System.IO.Path]::Combine($vault, ".claude", "skills", "ingest-outlook", "fetch.py")

          py -3 $fetch configure --show
          if ($LASTEXITCODE -ne 0) {
            throw "configure --show failed with exit code $LASTEXITCODE"
          }

          $env:INGEST_OUTLOOK_GRAPH_BASE = "http://127.0.0.1:9"
          $doctorStderr = [System.IO.Path]::Combine($env:RUNNER_TEMP, "doctor-stderr.txt")
          py -3 $fetch doctor 2> $doctorStderr
          if ($LASTEXITCODE -notin @(0, 1)) {
            throw "doctor crashed with exit code $LASTEXITCODE"
          }
          $doctorText = ""
          if (Test-Path -LiteralPath $doctorStderr) {
            $doctorText = [System.IO.File]::ReadAllText($doctorStderr)
          }
          if ($doctorText -match "Traceback") {
            throw "doctor printed a traceback: $doctorText"
          }

          $special = [System.IO.Path]::Combine($env:RUNNER_TEMP, "vault con tildé [x]")
          Invoke-Installer $special
          Invoke-Installer $special
          Assert-SkillInstalled $special
          $specialFetch = [System.IO.Path]::Combine($special, ".claude", "skills", "ingest-outlook", "fetch.py")
          py -3 $specialFetch configure --show
          if ($LASTEXITCODE -ne 0) {
            throw "configure --show failed for the spaced path with exit code $LASTEXITCODE"
          }
